name: Build Creator Hub Live

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CreatorHubLive.csproj

      - name: Publish Windows x64
        run: dotnet publish CreatorHubLive.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Creator-Hub-Live-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
